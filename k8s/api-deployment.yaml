apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskqueue-api
  namespace: taskqueue
  labels:
    app: taskqueue-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskqueue-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taskqueue-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: taskqueue-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: taskqueue-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskqueue-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: taskqueue-api-service
  namespace: taskqueue
spec:
  type: LoadBalancer
  selector:
    app: taskqueue-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskqueue-api-hpa
  namespace: taskqueue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskqueue-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskqueue-worker
  namespace: taskqueue
  labels:
    app: taskqueue-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskqueue-worker
  template:
    metadata:
      labels:
        app: taskqueue-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: worker
          image: taskqueue-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py", "--workers", "2"]
          envFrom:
            - configMapRef:
                name: taskqueue-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskqueue-secrets
                  key: DATABASE_URL
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskqueue-worker-hpa
  namespace: taskqueue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskqueue-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
